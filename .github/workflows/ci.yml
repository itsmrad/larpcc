name: CI

on:
  pull_request:
    branches: [main, stage/2-core]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - if: runner.os != 'Windows'
        run: python crates/larpcc-cli/tests/support/prepare_parent.py
      - if: runner.os == 'Windows'
        env:
          LARPCC_FAKE_MODE: prepare-parent
        run: |
          cargo +stable build --locked --features synthetic-launch --bin larpcc-fake-provider --target-dir bootstrap-target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\bootstrap-target\debug\larpcc-fake-provider.exe
      - if: runner.os == 'macOS'
        run: cc -Wall -Werror crates/larpcc-cli/tests/support/macos_acl_abi.c -o acl-abi && ./acl-abi
      - if: runner.os == 'Linux'
        run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable test --workspace --locked
      - if: runner.os == 'Windows'
        run: |
          cargo +stable test --bin larp --locked platform::windows::tests::w01_w03_existing_security_refuses_without_changing_contents_or_acl -- --exact --nocapture 2>&1 | Tee-Object -Variable cleanupEvidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = $cleanupEvidence -join "`n"
          if ($text -notmatch 'test result: ok\. 1 passed; 0 failed;' -or $text -notmatch 'platform::windows::tests::w01_w03_existing_security_refuses_without_changing_contents_or_acl') { throw 'missing exact native security/cleanup test execution' }
          if ($text.Contains('empty-DACL specimen cleanup unsupported')) { Write-Output 'Native specimen cleanup remains unsupported and unqualified.' }
      - if: runner.os == 'Windows'
        run: |
          cargo +stable test --workspace --locked w01_actual_token_elevation_is_recorded -- --nocapture 2>&1 | Tee-Object -Variable evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = $evidence -join "`n"
          if ($text -notmatch 'test result: ok\. [1-9][0-9]* passed' -or $text -notmatch 'w01_actual_token_elevation_is_recorded') { throw 'missing native elevation test execution' }
          if ($text -notmatch 'TokenIsElevated\s*[:=]\s*(true|false)') { throw 'missing native TokenIsElevated boolean' }
          if ($Matches[1] -eq 'true') { Write-Output 'Elevated result only; non-elevated qualification is still required.' }
      - run: cargo +stable build --release --bin larp --locked
      - run: cargo +stable clippy --workspace --all-targets --features synthetic-launch --target-dir "${{ env.LARPCC_TEST_PARENT }}/synthetic-target" --locked -- -D warnings
      - run: cargo +stable test --workspace --features synthetic-launch --target-dir "${{ env.LARPCC_TEST_PARENT }}/synthetic-target" --locked
      - run: cargo +stable test --bin larpcc-synthetic --features synthetic-launch --target-dir "${{ env.LARPCC_TEST_PARENT }}/synthetic-target" --locked

  msrv:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python crates/larpcc-cli/tests/support/prepare_parent.py
      - run: rustup toolchain install 1.89 --profile minimal
      - run: cargo +1.89 test --workspace --locked
      - run: cargo +1.89 test --workspace --features synthetic-launch --target-dir "${{ env.LARPCC_TEST_PARENT }}/synthetic-target" --locked
      - run: cargo +1.89 test --bin larpcc-synthetic --features synthetic-launch --target-dir "${{ env.LARPCC_TEST_PARENT }}/synthetic-target" --locked
