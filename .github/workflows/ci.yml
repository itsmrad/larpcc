name: CI

on:
  pull_request:
    branches: [main, stage/2-core, stage/3-core]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - if: runner.os == 'macOS'
        name: Check local macOS installer
        shell: bash
        run: |
          bash -n scripts/install-macos.sh
          ./scripts/install-macos.sh --help
          ./scripts/install-macos.sh --dry-run
          runner_temp=$(cd -P -- "$RUNNER_TEMP" && pwd -P)
          ./scripts/install-macos.sh --prefix "$runner_temp/custom bin" --dry-run
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - if: runner.os != 'Windows'
        run: python crates/larpcc-cli/tests/support/prepare_parent.py
      - if: runner.os == 'Windows'
        env:
          LARPCC_FAKE_MODE: prepare-parent
        run: |
          cargo +stable build --locked --features synthetic-launch --bin larpcc-fake-provider --target-dir bootstrap-target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\bootstrap-target\debug\larpcc-fake-provider.exe
      - if: runner.os == 'Linux'
        name: Verify stage acceptance refuses an unsafe test environment
        run: |
          python_path=$(command -v python)
          fake_bin=$(mktemp -d)
          trap 'rm -rf "$fake_bin"' EXIT
          mkdir "$fake_bin/home" "$fake_bin/fixture-parent"
          printf '%s\n' '#!/bin/sh' ': > "$0.invoked"' 'echo "unexpected cargo invocation" >&2' 'exit 99' > "$fake_bin/cargo"
          chmod +x "$fake_bin/cargo"
          for script in stage04_check.py stage14_check.py; do
            status=0
            env -u LARPCC_TEST_PARENT PATH="$fake_bin" "$python_path" -B "crates/larpcc-cli/tests/support/$script" +stable || status=$?
            test ! -e "$fake_bin/cargo.invoked"
            test "$status" -eq 2
            status=0
            env -u GITHUB_ACTIONS LARPCC_TEST_PARENT="$fake_bin/fixture-parent" HOME="$fake_bin/home" PATH="$fake_bin" "$python_path" -B "crates/larpcc-cli/tests/support/$script" +stable || status=$?
            test ! -e "$fake_bin/cargo.invoked"
            test "$status" -eq 2
          done
      - if: runner.os == 'macOS'
        run: cc -Wall -Werror crates/larpcc-cli/tests/support/macos_acl_abi.c -o acl-abi && ./acl-abi
      - if: runner.os == 'Linux'
        run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable test --workspace --locked
      - if: runner.os == 'macOS'
        name: Repeat stage04_delete 20 times
        shell: bash
        run: |
          for iteration in {1..20}; do
            echo "stage04_delete run $iteration/20"
            cargo +stable test --test stage04_delete --locked stage04_delete -- --exact | tee stage04-delete.log
            grep -Fq 'test result: ok. 1 passed; 0 failed;' stage04-delete.log
          done
      - if: runner.os == 'macOS'
        name: Repeat full stage04_delete suite 10 times
        shell: bash
        run: |
          for iteration in {1..10}; do
            echo "stage04_delete suite run $iteration/10"
            cargo +stable test --test stage04_delete --locked | tee stage04-delete-suite.log
            grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;' stage04-delete-suite.log
          done
      - run: python crates/larpcc-cli/tests/support/stage04_check.py +stable
      - run: python crates/larpcc-cli/tests/support/stage04_check.py +stable
        env:
          LARPCC_STAGE_FILTER: stage06_
      - run: python crates/larpcc-cli/tests/support/stage04_check.py +stable
        env:
          LARPCC_STAGE_FILTER: stage07_
      - run: python crates/larpcc-cli/tests/support/stage04_check.py +stable
        env:
          LARPCC_STAGE_FILTER: stage08_
      - if: runner.os == 'macOS'
        name: Repeat the stage08 held-home probe 20 times
        shell: bash
        timeout-minutes: 5
        run: |
          test_name=provider::version::tests::stage08_spawn_enters_held_home_without_pathname_chdir
          log="$RUNNER_TEMP/stage08-held-home.log"
          for iteration in {1..20}; do
            echo "stage08 held-home probe run $iteration/20"
            cargo +stable test --test stage05_receipts --locked "$test_name" -- --exact | tee "$log"
            grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured;' "$log"
          done
      - run: python crates/larpcc-cli/tests/support/stage04_check.py +stable
        env:
          LARPCC_STAGE_FILTER: stage11_
      - run: python crates/larpcc-cli/tests/support/stage04_check.py +stable
        env:
          LARPCC_STAGE_FILTER: stage19_
      - if: runner.os == 'Windows'
        run: |
          cargo +stable test --bin larp --locked platform::windows::tests::w01_w03_existing_security_refuses_without_changing_contents_or_acl -- --exact --nocapture 2>&1 | Tee-Object -Variable cleanupEvidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = $cleanupEvidence -join "`n"
          if ($text -notmatch 'test result: ok\. 1 passed; 0 failed;' -or $text -notmatch 'platform::windows::tests::w01_w03_existing_security_refuses_without_changing_contents_or_acl') { throw 'missing exact native security/cleanup test execution' }
          if ($text.Contains('empty-DACL specimen cleanup unsupported')) { Write-Output 'Native specimen cleanup remains unsupported and unqualified.' }
      - if: runner.os == 'Windows'
        run: |
          cargo +stable test --workspace --locked w01_actual_token_elevation_is_recorded -- --nocapture 2>&1 | Tee-Object -Variable evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = $evidence -join "`n"
          if ($text -notmatch 'test result: ok\. [1-9][0-9]* passed' -or $text -notmatch 'w01_actual_token_elevation_is_recorded') { throw 'missing native elevation test execution' }
          if ($text -notmatch 'TokenIsElevated\s*[:=]\s*(true|false)') { throw 'missing native TokenIsElevated boolean' }
          if ($Matches[1] -eq 'true') { Write-Output 'Elevated result only; non-elevated qualification is still required.' }
      - run: cargo +stable build --release --bin larp --locked
      - if: runner.os == 'Linux'
        name: Verify source archive and packaged all-features install closure
        run: |
          cargo +stable package --locked --offline
          cargo +stable install --path "$CARGO_TARGET_DIR/package/larpcc-cli-0.1.0" --root "$LARPCC_TEST_PARENT/package-install" --all-features --locked --offline
          python crates/larpcc-cli/tests/support/package_closure.py
      - run: cargo +stable test --test gate --all-features --locked
      - run: cargo +stable clippy --workspace --all-targets --features synthetic-launch --target-dir "${{ env.LARPCC_TEST_PARENT }}/synthetic-target" --locked -- -D warnings
      - run: cargo +stable test --workspace --features synthetic-launch --target-dir "${{ env.LARPCC_TEST_PARENT }}/synthetic-target" --locked
      - run: python crates/larpcc-cli/tests/support/stage14_check.py +stable
        env:
          CARGO_TARGET_DIR: ${{ env.LARPCC_TEST_PARENT }}/synthetic-target
      - run: cargo +stable test --bin larpcc-synthetic --features synthetic-launch --target-dir "${{ env.LARPCC_TEST_PARENT }}/synthetic-target" --locked
      - if: runner.os == 'Windows'
        name: Report bounded grandchild process timings
        run: |
          cargo +stable test --test windows_launch --features synthetic-launch --target-dir "${{ env.LARPCC_TEST_PARENT }}/synthetic-target" --locked l07_bounded_grandchild_inherits_exact_selected_home -- --exact --nocapture 2>&1 | Tee-Object -Variable grandchildEvidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = $grandchildEvidence -join "`n"
          if ($text -notmatch 'test result: ok\. 1 passed; 0 failed;' -or $text -notmatch 'l07_bounded_grandchild_inherits_exact_selected_home') { throw 'missing exact native grandchild test execution' }
          foreach ($fixtureProfile in @('claudea', 'codexb')) {
            if (-not $text.Contains("L07 $fixtureProfile process timing:") -or -not $text.Contains("L07 $fixtureProfile output collected_ms=")) { throw "missing native grandchild timing for $fixtureProfile" }
          }

      - if: runner.os == 'Windows'
        name: Checkout exact vulnerable J2 for isolated negative control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c2f42db51929f48d7b7a925d763b3189640acb51
          path: .auth-cleanup-before
          persist-credentials: false
      - if: runner.os == 'Windows'
        name: Prove auth guard regression fails on vulnerable J2
        working-directory: .auth-cleanup-before
        env:
          CARGO_TARGET_DIR: ${{ env.LARPCC_TEST_PARENT }}/auth-cleanup-before-target
        run: '& "$env:GITHUB_WORKSPACE/crates/larpcc-cli/tests/support/windows_auth_cleanup.ps1" -Phase before'
      - if: runner.os == 'Windows'
        name: Prove auth and Run lifecycle regressions pass on PR head
        run: '& ./crates/larpcc-cli/tests/support/windows_auth_cleanup.ps1 -Phase after'

  msrv:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python crates/larpcc-cli/tests/support/prepare_parent.py
      - run: rustup toolchain install 1.89 --profile minimal
      - run: cargo +1.89 test --workspace --locked
      - run: python crates/larpcc-cli/tests/support/stage04_check.py +1.89
      - run: python crates/larpcc-cli/tests/support/stage04_check.py +1.89
        env:
          LARPCC_STAGE_FILTER: stage06_
      - run: python crates/larpcc-cli/tests/support/stage04_check.py +1.89
        env:
          LARPCC_STAGE_FILTER: stage07_
      - run: python crates/larpcc-cli/tests/support/stage04_check.py +1.89
        env:
          LARPCC_STAGE_FILTER: stage08_
      - run: python crates/larpcc-cli/tests/support/stage04_check.py +1.89
        env:
          LARPCC_STAGE_FILTER: stage11_
      - run: python crates/larpcc-cli/tests/support/stage04_check.py +1.89
        env:
          LARPCC_STAGE_FILTER: stage19_
      - run: cargo +1.89 test --workspace --features synthetic-launch --target-dir "${{ env.LARPCC_TEST_PARENT }}/synthetic-target" --locked
      - run: python crates/larpcc-cli/tests/support/stage14_check.py +1.89
        env:
          CARGO_TARGET_DIR: ${{ env.LARPCC_TEST_PARENT }}/synthetic-target
      - run: cargo +1.89 test --bin larpcc-synthetic --features synthetic-launch --target-dir "${{ env.LARPCC_TEST_PARENT }}/synthetic-target" --locked
