[package]
name = "larpcc-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "CLI-first account profiles for Claude Code and Codex"

[[bin]]
name = "larp"
path = "src/main.rs"


[features]
default = []
synthetic-launch = []

[[bin]]
name = "larpcc-synthetic"
path = "tests/support/driver.rs"
required-features = ["synthetic-launch"]
test = false

[[bin]]
name = "larpcc-fake-provider"
path = "tests/support/fake.rs"
required-features = ["synthetic-launch"]
test = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_Pipes"] }

[dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
tempfile = "=3.27.0"
